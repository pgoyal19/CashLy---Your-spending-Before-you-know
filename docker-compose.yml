version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cashly
      POSTGRES_PASSWORD: cashlypass
      POSTGRES_DB: cashly
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cashly:cashlypass@postgres:5432/cashly?schema=public
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      OPENAI_API_KEY: ""
      AI_SERVICE_URL: http://ai-service:8001
      PORT: 8000
      NODE_ENV: development
    depends_on:
      - postgres
      - ai-service
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      PORT: 8001
    ports:
      - '8001:8001'
    volumes:
      - ./ai-service:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
